# Test Aury na prawdziwym Macu (Apple Silicon) w chmurze GitHuba.
# Actions → "Test na macOS" → Run workflow. Wynik: artefakt "aura-mac-test" ze zrzutami wyspy,
# dziennikiem błędów (aura-bledy.log) i wyjściem programu z trzech uruchomień:
#  1) z kodu, symulowany notch (zrzuty stanów),
#  2) zbudowana aplikacja Aura.app (zrzuty stanów),
#  3) zwykłe uruchomienie Aura.app na 25 s — czy działa i się nie wyłącza.
name: Test na macOS

on:
  workflow_dispatch:
    inputs:
      tag:
        description: 'Wydanie do sprawdzenia jako pobrany .dmg (np. v2.1.8); puste = pomiń'
        required: false
        default: ''
      tylko_dmg:
        description: 'Tylko krok 4 (pobrany .dmg), bez budowania z kodu'
        type: boolean
        default: false

jobs:
  test:
    runs-on: macos-latest
    timeout-minutes: 30
    env:
      OUT: ${{ github.workspace }}/aura-mac-test
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        if: ${{ !inputs.tylko_dmg }}
        with:
          node-version: 22
          cache: npm

      - name: Zależności
        if: ${{ !inputs.tylko_dmg }}
        run: npm ci

      - name: System
        run: |
          mkdir -p "$OUT"
          { sw_vers; uname -m; system_profiler SPDisplaysDataType | grep -E "Resolution|Retina" || true; } | tee "$OUT/system.txt"
          { echo "--- pamięć (sysctl, vm_stat, top):"; sysctl hw.memsize; vm_stat; top -l 1 -s 0 | grep PhysMem; } | tee "$OUT/pamiec.txt" || true

      - name: 1) Z kodu, symulowany notch — zrzuty
        if: ${{ !inputs.tylko_dmg }}
        run: |
          mkdir -p "$OUT/1-z-kodu"
          WYSPA_SHOT="$OUT/1-z-kodu" WYSPA_VIZ=1 WYSPA_FAKE_NOTCH=1 npx electron . > "$OUT/1-z-kodu/wyjscie.txt" 2>&1 &
          PID=$!; for i in $(seq 1 120); do sleep 1; kill -0 $PID 2>/dev/null || break; done
          kill $PID 2>/dev/null || true
          ls -la "$OUT/1-z-kodu"

      - name: Budowanie Aura.app (arm64, bez instalatora)
        if: ${{ !inputs.tylko_dmg }}
        run: npx electron-builder --mac dir --arm64 --publish never
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'

      - name: 2) Aura.app, symulowany notch — zrzuty
        if: ${{ !inputs.tylko_dmg }}
        run: |
          pkill -f "Electron.app" || true; pkill -f "Aura.app" || true; sleep 2  # poprzednia kopia nie może blokować nowej
          mkdir -p "$OUT/2-aplikacja"
          APP="$(ls -d dist/mac*/Aura.app | head -1)"; echo "aplikacja: $APP"
          WYSPA_SHOT="$OUT/2-aplikacja" WYSPA_VIZ=1 WYSPA_FAKE_NOTCH=1 "$APP/Contents/MacOS/Aura" > "$OUT/2-aplikacja/wyjscie.txt" 2>&1 &
          PID=$!; for i in $(seq 1 120); do sleep 1; kill -0 $PID 2>/dev/null || break; done
          kill $PID 2>/dev/null || true
          ls -la "$OUT/2-aplikacja"

      - name: 3) Aura.app, zwykłe uruchomienie na 25 s
        if: ${{ !inputs.tylko_dmg }}
        run: |
          pkill -f "Electron.app" || true; pkill -f "Aura.app" || true; sleep 2  # poprzednia kopia nie może blokować nowej
          mkdir -p "$OUT/3-zwykle"
          APP="$(ls -d dist/mac*/Aura.app | head -1)"
          "$APP/Contents/MacOS/Aura" > "$OUT/3-zwykle/wyjscie.txt" 2>&1 &
          PID=$!; sleep 25
          if kill -0 $PID 2>/dev/null; then echo "DZIAŁA po 25 s" | tee "$OUT/3-zwykle/wynik.txt"; else echo "WYŁĄCZYŁA SIĘ przed 25 s" | tee "$OUT/3-zwykle/wynik.txt"; fi
          screencapture -x "$OUT/3-zwykle/ekran.png" || true
          kill $PID 2>/dev/null || true; sleep 2

      - name: 5) Wyspa na dole ekranu + pomocnik PC Deck
        if: ${{ !inputs.tylko_dmg }}
        run: |
          pkill -f "Electron.app" || true; pkill -f "Aura.app" || true; sleep 2
          mkdir -p "$OUT/5-dol-deck"
          APP="$(ls -d dist/mac*/Aura.app | head -1)"
          WYSPA_SHOT="$OUT/5-dol-deck" WYSPA_VIZ=1 WYSPA_VIZ_EDGE=bottom "$APP/Contents/MacOS/Aura" > "$OUT/5-dol-deck/wyjscie.txt" 2>&1 &
          PID=$!; sleep 9; screencapture -x "$OUT/5-dol-deck/ekran-dol.png" || true
          for i in $(seq 1 60); do sleep 1; kill -0 $PID 2>/dev/null || break; done
          kill $PID 2>/dev/null || true
          printf 'm 30 20\ns 240 0\nk 175\nx 17,67\nk 37\nq\n' | /usr/bin/osascript -l JavaScript native/deck-mac.js > "$OUT/5-dol-deck/deck.txt" 2>&1 || echo "kod wyjścia: $?" >> "$OUT/5-dol-deck/deck.txt"
          echo "--- pomocnik Decka:"; cat "$OUT/5-dol-deck/deck.txt"
          ls -la "$OUT/5-dol-deck"

      - name: 6) Aktualizacja na Macu — pobranie, podmiana Aura.app i ponowne uruchomienie
        if: ${{ !inputs.tylko_dmg }}
        run: |
          pkill -f "Electron.app" || true; pkill -f "Aura.app" || true; sleep 2
          mkdir -p "$OUT/6-aktualizacja"; cd "$OUT/6-aktualizacja"
          rm -rf /Applications/Aura.app; ditto "$(ls -d $GITHUB_WORKSPACE/dist/mac*/Aura.app | head -1)" /Applications/Aura.app
          echo "stara paczka" > /Applications/Aura.app/Contents/znacznik-testu.txt
          WYSPA_GH_TOKEN="${{ github.token }}" WYSPA_SHOT="$PWD" WYSPA_UPDATETEST=1 WYSPA_AUTOUPD=1 WYSPA_AUTOUPD_INSTALL=1 /Applications/Aura.app/Contents/MacOS/Aura > wyjscie.txt 2>&1 &
          for i in $(seq 1 75); do sleep 2; grep -q "instaluję" autoupd.txt 2>/dev/null && break; done
          sleep 20
          { echo "--- dziennik podmiany:"; cat "$TMPDIR/Aura-aktualizacja.log" 2>/dev/null || cat /tmp/Aura-aktualizacja.log 2>/dev/null || true;
            echo "--- stany:"; grep -v '"downloading"' autoupd.txt | tail -8; grep '"downloading"' autoupd.txt | tail -1;
            echo "--- znacznik starej paczki: $(test -f /Applications/Aura.app/Contents/znacznik-testu.txt && echo JEST — nie podmieniono || echo brak — podmieniono)";
            echo "--- wersja w Aplikacjach: $(defaults read /Applications/Aura.app/Contents/Info CFBundleShortVersionString)";
            echo "--- Aura działa po podmianie:"; ps aux | grep "[A]pplications/Aura.app/Contents/MacOS/Aura" | head -2 || true; } | tee wynik.txt
          pkill -f "Aura.app" || true
          cd "$GITHUB_WORKSPACE"

      - name: 7) Prawdziwe szkło na Macu (kolorowa plansza za wyspą)
        if: ${{ !inputs.tylko_dmg }}
        run: |
          pkill -f "Electron.app" || true; pkill -f "Aura.app" || true; sleep 2
          mkdir -p "$OUT/7-szklo"
          D="$HOME/Library/Application Support/Aura"; mkdir -p "$D"
          node -e "const f=process.argv[1];let s={};try{s=JSON.parse(require('fs').readFileSync(f,'utf8'))}catch{};Object.assign(s,{surface:'glass',macRealGlass:true,edge:'top'});require('fs').writeFileSync(f,JSON.stringify(s))" "$D/ustawienia.json"
          APP="$(ls -d dist/mac*/Aura.app | head -1)"
          WYSPA_SHOT="$OUT/7-szklo" WYSPA_GLASSTEST=launcher "$APP/Contents/MacOS/Aura" > "$OUT/7-szklo/wyjscie.txt" 2>&1 &
          PID=$!; for i in $(seq 1 60); do sleep 1; kill -0 $PID 2>/dev/null || break; done
          kill $PID 2>/dev/null || true
          ls -la "$OUT/7-szklo"

      - name: 8) AirDrop — menu „Udostępnij” z półki
        if: ${{ !inputs.tylko_dmg }}
        run: |
          pkill -f "Electron.app" || true; pkill -f "Aura.app" || true; sleep 2
          mkdir -p "$OUT/8-airdrop"
          APP="$(ls -d dist/mac*/Aura.app | head -1)"
          WYSPA_SHOT="$OUT/8-airdrop" WYSPA_AIRDROPTEST=1 "$APP/Contents/MacOS/Aura" > "$OUT/8-airdrop/wyjscie.txt" 2>&1 &
          PID=$!; sleep 8; screencapture -x "$OUT/8-airdrop/menu.png" || true
          for i in $(seq 1 20); do sleep 1; kill -0 $PID 2>/dev/null || break; done
          kill $PID 2>/dev/null || true

      - name: 4) Pobrany .dmg z wydania — jak u użytkownika
        if: ${{ inputs.tag != '' }}
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ inputs.tag }}
        run: |
          pkill -f "Electron.app" || true; pkill -f "Aura.app" || true; sleep 2
          mkdir -p "$OUT/4-dmg"; cd "$OUT/4-dmg"
          gh release download "$TAG" --repo "$GITHUB_REPOSITORY" --pattern "*mac-arm64.dmg" --dir .
          DMG="$(ls *.dmg | head -1)"; echo "plik: $DMG" | tee wynik.txt
          xattr -w com.apple.quarantine "0083;$(printf %x $(date +%s));Safari;" "$DMG"   # jak po pobraniu przeglądarką
          hdiutil attach "$DMG" -nobrowse -mountpoint /tmp/aura-dmg | tail -1
          ls -la /tmp/aura-dmg | tee -a wynik.txt
          rm -rf /Applications/Aura.app; cp -R /tmp/aura-dmg/Aura.app /Applications/ ; hdiutil detach /tmp/aura-dmg || true
          { echo "--- podpis:"; codesign -dv --verbose=2 /Applications/Aura.app 2>&1; echo "--- weryfikacja podpisu:"; (codesign --verify --deep --strict /Applications/Aura.app 2>&1 && echo OK) || true;
            echo "--- Gatekeeper:"; spctl --assess --type execute -vv /Applications/Aura.app 2>&1 || true;
            echo "--- kwarantanna:"; xattr -l /Applications/Aura.app | head -5 || true;
            echo "--- architektura:"; file /Applications/Aura.app/Contents/MacOS/Aura; } >> wynik.txt 2>&1
          cp "$HOME/Library/Application Support/Aura/aura-bledy.log" "$OUT/aura-bledy-kroki-1-3.log" 2>/dev/null || true
          rm -rf "$HOME/Library/Application Support/Aura"   # świeża instalacja: pierwsze uruchomienie
          /Applications/Aura.app/Contents/MacOS/Aura > wyjscie.txt 2>&1 &
          PID=$!
          sleep 3; screencapture -x ekran-03s.png || true
          sleep 5; screencapture -x ekran-08s.png || true
          sleep 12; screencapture -x ekran-20s.png || true
          sleep 5
          if kill -0 $PID 2>/dev/null; then echo "DZIAŁA po 25 s" | tee -a wynik.txt; else echo "WYŁĄCZYŁA SIĘ przed 25 s" | tee -a wynik.txt; fi
          ps aux | grep -i "[A]ura" | head -8 >> wynik.txt || true
          { echo "--- dane po pierwszym starcie:"; ls -la "$HOME/Library/Application Support/Aura"; cat "$HOME/Library/Application Support/Aura/aura-bledy.log"; } >> wynik.txt 2>&1 || true
          kill $PID 2>/dev/null || true; sleep 2
          cat wynik.txt

      - name: Dziennik błędów i ustawienia
        if: always()
        run: |
          D="$HOME/Library/Application Support/Aura"
          ls -la "$D" > "$OUT/folder-danych.txt" 2>&1 || true
          cp "$D/aura-bledy.log" "$OUT/" 2>/dev/null || echo "brak dziennika błędów (dobrze)" > "$OUT/aura-bledy.log"

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: aura-mac-test
          path: aura-mac-test
