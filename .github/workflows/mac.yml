# Buduje Aurę na macOS (Apple Silicon i Intel) i dołącza pliki do wydania na GitHubie.
# Uruchamianie: Actions → "Aura na macOS" → Run workflow → wpisz tag wydania (np. v2.1.0).
name: Aura na macOS

on:
  workflow_dispatch:
    inputs:
      tag:
        description: 'Tag wydania, do którego dołączyć pliki (np. v2.1.0)'
        required: true

permissions:
  contents: write

jobs:
  mac:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.tag }}

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Zależności
        run: npm ci

      - name: Budowanie (.dmg i .zip, arm64 + x64)
        run: npm run dist:mac
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'

      - name: Dołączenie do wydania
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          ls -la dist
          gh release upload "${{ github.event.inputs.tag }}" dist/*.dmg dist/*-mac-*.zip --clobber --repo "${{ github.repository }}"
